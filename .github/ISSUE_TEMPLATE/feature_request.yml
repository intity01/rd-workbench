name: Feature request
description: Suggest an idea or improvement
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [UI / screens, Core / graph, Documents / workers, AI providers, Storage / search, Plugins, Docs, Other]
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase (if known)
      options: ["Phase 1", "Phase 2", "Phase 3", "Phase 4", "Phase 5", "Not sure"]
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: This does not need a webview or automation of a vendor's web app.
          required: true
