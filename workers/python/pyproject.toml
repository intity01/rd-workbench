[project]
name = "rdw-worker"
version = "0.1.0"
description = "Document extraction worker for R&D Workbench (speaks the rdw-ipc protocol over stdio)."
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = []

[project.optional-dependencies]
# Heavy, model-backed extraction. Check each project's model-weight licence before use.
marker = ["marker-pdf"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rdw_worker"]

[tool.ruff]
line-length = 120
target-version = "py311"
